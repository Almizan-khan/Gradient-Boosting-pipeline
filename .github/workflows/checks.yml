name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q -x 'notebooks|original' .
      - run: python -m unittest discover -s tests -v
      - run: python benchmark.py --output reports/ci-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: reports/ci-benchmark.json
